<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CRM{% endblock %} · CRM продаж</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%233247c5%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="top"><div class="in">
  <a class="brand" href="/">CRM продаж</a>
  <a class="nav {{ 'on' if path.startswith('/tasks') }}" href="/tasks">Мои задачи</a>
  <a class="nav {{ 'on' if path.startswith('/pipeline') or path.startswith('/deals') }}" href="/pipeline">Воронка</a>
  <a class="nav {{ 'on' if path.startswith('/companies') }}" href="/companies">Компании</a>
  {% if user.is_head %}
  <a class="nav {{ 'on' if path.startswith('/import') }}" href="/import">Импорт</a>
  <a class="nav {{ 'on' if path.startswith('/reports') }}" href="/reports">Отчёт</a>
  <a class="nav {{ 'on' if path.startswith('/settings') }}" href="/settings/pipelines">Настройки</a>
  {% endif %}
  <div class="who">
    <a href="/profile">{{ user.name }}</a><span>{{ 'руководитель' if user.is_head else 'менеджер' }}</span>
    <form method="post" action="/logout"><button>Выйти</button></form>
  </div>
</div></header>
{% endif %}
<main>
{% for level, message in flashes %}<div class="flash {{ level }}">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
