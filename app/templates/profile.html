{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<div class="head"><div><h1>{{ user.name }}</h1><p class="lead">Логин: {{ user.login }}</p></div></div>
<div class="card" style="max-width:420px">
  <h2>Сменить пароль</h2>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post" action="/profile">
    <div class="fields" style="grid-template-columns:1fr">
      <div><label>Текущий пароль</label><input type="password" name="old_password" autocomplete="current-password"></div>
      <div><label>Новый пароль (от 8 символов)</label><input type="password" name="new_password" autocomplete="new-password"></div>
    </div>
    <button class="btn primary">Сохранить пароль</button>
  </form>
</div>
{% endblock %}
