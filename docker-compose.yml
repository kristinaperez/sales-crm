services:
  crm:
    build: .
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/crm.db}
      APP_TZ: ${APP_TZ:-Europe/Moscow}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-head}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Владелец}
      CURRENCY: ${CURRENCY:-₽}
      SECRET_KEY: ${SECRET_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-0}
      SESSION_HTTPS_ONLY: ${SESSION_HTTPS_ONLY:-0}
    volumes:
      # Постоянный диск: база, ключ сессий и резервные копии переживают пересоздание контейнера.
      - crm-data:/data

volumes:
  crm-data:
